<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR do estande</title>
<style>
  body { margin: 0; background: #fff; color: #111; font-family: system-ui, sans-serif; text-align: center; }
  .page { padding: 40px 16px; }
  h1 { font-size: 52px; margin: 0 0 8px; line-height: 1.05; }
  h1 em { font-style: normal; background: #ffd166; padding: 0 8px; border-radius: 8px; }
  p { font-size: 22px; margin: 8px 0; }
  #qr { display: inline-block; padding: 18px; border: 6px solid #111; border-radius: 18px; margin: 22px 0; }
  #qr img, #qr canvas { width: min(70vw, 420px) !important; height: auto !important; display: block; }
  .url { font-family: ui-monospace, monospace; font-size: 20px; word-break: break-all; }
  .games { font-size: 24px; margin-top: 18px; }
  @media print { .page { padding: 0; } }
</style>
</head>
<body>
<div class="page">
  <h1>Você é <em>previsível</em>?</h1>
  <p>Jogue contra uma IA no seu celular 📱</p>
  <div id="qr"></div>
  <p class="url">uaipedro.github.io/voce-e-previsivel</p>
  <p class="games">🚪 Portas · ✊ Pedra, Papel e Tesoura · 🕵️ Quem é? · 🔤 Palavra Secreta</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
new QRCode(document.getElementById('qr'), { text: 'https://uaipedro.github.io/voce-e-previsivel/', width: 840, height: 840, correctLevel: QRCode.CorrectLevel.M });
</script>
</body>
</html>
